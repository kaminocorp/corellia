name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in package.json (the action
      # refuses a `version` input that differs from it).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm -C client build

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: cd backend && go vet ./...
      - run: cd backend && go test -race -count=1 ./...
      - run: cd backend && gofmt -l . && test -z "$(gofmt -l .)"

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in package.json (the action
      # refuses a `version` input that differs from it).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- backend/internal/contract client/src/contract shared

  box:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # curl, jq and python3 are on the runner image.
      - run: ./box/test.sh

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in package.json (the action
      # refuses a `version` input that differs from it).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C client exec playwright install --with-deps chromium-headless-shell
      - run: pnpm e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: client/test-results
          retention-days: 7
